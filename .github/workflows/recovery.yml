name: Recovery checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check recovery integrity and extraction guardrails
        run: python3 -m unittest discover -s tests -p 'test_recovery.py' -v
      - name: Check Python syntax
        run: python3 -m py_compile scripts/msi_recovery.py scripts/verify-integrated.py
